# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
tone_instructions: "Direct, no filler, no praise."

reviews:
  profile: assertive

  auto_review:
    # CodeRabbit cannot filter by head branch, so automated pull requests are
    # skipped by author: Renovate opens `renovate/*`, the release manager app
    # opens `release-please--*`. Both the bot login and the bare app slug are
    # listed because the match is exact.
    ignore_usernames:
      - "renovate[bot]"
      - "renovate"
      - "automatic-release-manager[bot]"
      - "automatic-release-manager"

  # Generated or tool-owned files. Review their sources instead.
  path_filters:
    - "!**/Cargo.lock"
    - "!target/**"
    - "!CHANGELOG.md"
    - "!.release-please-manifest.json"
    - "!README.md" # rendered from .github/templates/README.md.hbs
    - "!docs/config.contract.json" # written by `just regenerate` from src/config.rs

  path_instructions:
    - path: "src/**/*.rs"
      instructions: |
        Single-binary HTTP service (actix-web) that streams S3 objects under fixed paths. Flag:
        - `unwrap`, `expect`, `panic!`, `unreachable!` or panicking indexing outside tests and
          outside startup code that cannot recover; request paths must return errors, not panic.
        - Blocking work (std::fs, std::thread::sleep, sync S3/HTTP, heavy CPU) on the async runtime.
        - Network calls without bounded timeouts, and unbounded buffering of object bodies; bodies
          must stay streamed.
        - Logging of secrets, credentials, DSNs, signed URLs or full upstream error bodies.
        - Bare `#[allow(...)]`; use `#[expect(..., reason = "...")]` as the crate already does.
        - Missing rustdoc, `# Errors` / `# Panics` sections (clippy pedantic and `missing_docs` are on).
        - New dependencies or default features: justify them; the `sentry` feature must stay
          optional and `--no-default-features` must still build and link no Sentry crate.
        Rust is pinned in rust-toolchain.toml; there is no MSRV.
    - path: "src/routes/**"
      instructions: |
        Public request surface. Only configured entries may reach S3: no request input may become a
        bucket key, list call or probe. Check status codes, that store errors are logged but never
        returned to the client, that the catch-all route stays registered last, and that headers
        (content type, cache, content disposition) cannot be influenced by request input.
    - path: "src/{config.rs,config/**}"
      instructions: |
        Layered configuration via terrace-config. Secrets must be `secrecy` types, never `Debug`- or
        `Serialize`-exposed in clear, and loadable through the `_FILE` indirection. Every struct keeps
        `#[serde(deny_unknown_fields)]`. A renamed or removed key is a breaking change for operators:
        require a CHANGELOG-worthy commit type and a regenerated contract. Hot reload must not leave
        the service half-reconfigured on a failed rebuild.
    - path: "src/telemetry/**"
      instructions: |
        Sentry and tracing setup. Flag anything that sends request bodies, headers, query strings,
        client IPs or credentials to Sentry, that enables Sentry products not declared in
        Cargo.toml, or that makes telemetry failure fatal to serving.
    - path: "examples/**"
      instructions: |
        Generators for the README tables and the config contract, not runtime code. Check that the
        output stays deterministic (stable ordering, no timestamps) and that Markdown escaping is
        handled by JSON, not string concatenation.
    - path: "tests/**"
      instructions: |
        Integration tests. `unwrap`/`expect` are fine; focus on whether assertions would catch the
        regression they name and on hidden reliance on network or global state.
    - path: "Dockerfile"
      instructions: |
        Base images pinned by digest where possible, runtime stays `scratch` and non-root, builds use
        `--locked`, no secrets in layers or build args. The block between
        `# terrace-config:labels:begin` and `# terrace-config:labels:end` is generated by
        `just dockerfile-labels`; flag hand edits there.
    - path: "justfile"
      instructions: |
        Shebang recipes must `set -euo pipefail` and quote expansions. Recipes are the single source
        of the commands CI and the README quote; flag drift from the workflows.
    - path: ".github/workflows/**"
      instructions: |
        Every third-party action must be pinned to a full commit SHA with a version comment.
        Require least-privilege `permissions:` at workflow or job level, `persist-credentials: false`
        on checkout unless pushing, no untrusted `${{ github.event.* }}` interpolation into `run:`,
        and no `pull_request_target` that checks out or executes PR code.
    - path: ".github/templates/**"
      instructions: |
        Source of the generated README.md. Review rendered wording, links and badge URLs here.

  pre_merge_checks:
    title:
      mode: error
      requirements: |
        Must follow Conventional Commits: `type(scope)?!?: subject`. Allowed types: feat, fix, perf,
        revert, docs, refactor, test, style, ci, build, chore, deps. Lowercase, imperative subject,
        no trailing period. release-please derives version bumps and the changelog from this title.

  tools:
    # Already enforced in CI (`cargo clippy -D warnings`); duplicating it adds noise.
    clippy:
      enabled: false
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    hadolint:
      enabled: true
    markdownlint:
      enabled: true
