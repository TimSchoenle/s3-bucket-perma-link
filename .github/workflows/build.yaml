name: Build

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@5798c7bd8d1d98a0c7360114e91a0ac3b86bf145 # tag=actions-rust-cargo-check-v1.1.5

  coverage:
    name: Coverage
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@ae790481e6030046269b563631f778ffe4454321 # tag=actions-rust-coverage-codecov-v1.1.38
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@c6844b562767b6e68fff4d39bdf9eced6e29b318 # tag=actions-rust-test-v1.1.1

  fmt:
    name: Auto Format
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Auto Format
        uses: TimSchoenle/actions/actions/rust/auto-format@bde85524c019be605fa345f4203c4a37b68f1336 # tag=actions-rust-auto-format-v1.1.11
        with:
          bot_app_id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          bot_private_key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@dcfb46a6a17ad8565db74057ce60278953056ad5 # tag=actions-rust-clippy-v1.1.9

  docker-build-test:
    name: Docker Build and Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Prepare platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: image:test
          build-args: |
            version=test
            release=test
            vendor=Timmi6790
            VERSION=test
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}

      - name: Verify image architecture
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          expected="${PLATFORM#*/}"
          actual=$(docker image inspect image:test --format='{{.Architecture}}')
          echo "Expected: ${expected}, actual: ${actual}"
          [ "${expected}" = "${actual}" ]

      - name: Test Docker image runs
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set +e
          output=$(docker run --rm image:test 2>&1)
          status=$?
          set -e
          echo "${output}"
          echo "Exit status: ${status}"
          # The image has no shell and the binary exits on missing configuration, so a
          # non-zero exit is expected. Exit codes in the 125-127 range mean the runtime
          # could not execute the binary at all, which is what a wrong-architecture or
          # broken (e.g. mis-packed) build looks like.
          if [ "${status}" -ge 125 ] && [ "${status}" -le 127 ]; then
            echo "::error::Container failed to execute the binary (exit ${status})"
            exit 1
          fi
          if echo "${output}" | grep -qi 'exec format error'; then
            echo "::error::Binary is not executable on ${PLATFORM}"
            exit 1
          fi

      - name: Check image size
        run: |
          SIZE=$(docker image inspect image:test --format='{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "Image size: ${SIZE}MB"
          mkdir -p "${RUNNER_TEMP}/sizes"
          echo "${SIZE}" > "${RUNNER_TEMP}/sizes/${PLATFORM_SLUG}"
          if [ "${SIZE}" -gt 150 ]; then
            echo "::warning::Image size (${SIZE}MB) exceeds 150MB threshold"
          fi

      - name: Upload image size
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sizes-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/sizes/*
          if-no-files-found: error
          retention-days: 1

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: image:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-${{ env.PLATFORM_SLUG }}

  docker-size-report:
    name: Docker Size Report
    runs-on: ubuntu-latest
    needs: docker-build-test
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write # Required to comment on PRs with image size
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Download image sizes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: sizes
          pattern: sizes-*
          merge-multiple: true

      - name: Comment image sizes on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const rows = fs.readdirSync('sizes')
              .sort()
              .map((file) => {
                const platform = file.replace('-', '/');
                const size = fs.readFileSync(`sizes/${file}`, 'utf8').trim();
                return `| \`${platform}\` | ${size}MB |`;
              })
              .join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🐳 **Docker image sizes**\n\n| Platform | Size |\n| --- | --- |\n${rows}`
            });

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0