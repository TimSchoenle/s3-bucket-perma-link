name: Build

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@88e964d440835fd99f7e9d17b4ba1b48544303ba # tag=actions-rust-cargo-check-v1.1.7

  # The upload authenticates with this job's OIDC token, so the job needs neither the `ci`
  # environment nor its `CODECOV_TOKEN`. `.github/codecov.yml` decides what the Codecov statuses
  # check.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required to authenticate the Codecov upload with OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@81e4009704e0963651bbd8275e31244c1d1e220d # tag=actions-rust-coverage-codecov-v2.0.3
        with:
          flags: rust

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-test-v1.1.2

  # Auto-format is split in two. `cargo fmt` honours the pull request's own `rust-toolchain.toml`
  # and `rustfmt.toml`, so this job runs code the pull request chose and holds no secret, no
  # environment and no write permission; it uploads what `cargo fmt` changed as a patch artifact.
  # `fmt-commit` below holds the App token and commits that patch, running no repository code.
  #
  # Pull requests only: a push to `master` has no pull request head to commit to.
  fmt:
    name: Auto Format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    outputs:
      changes_detected: ${{ steps.format.outputs.changes_detected }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The pull request head, not the default merge commit: the patch is committed to the branch,
      # so it has to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto Format
        id: format
        uses: TimSchoenle/actions/actions/rust/auto-format@495fd50fd4a5ae3d9fb1496c96eada74c6f2529a # tag=actions-rust-auto-format-v2.0.0
        with:
          artifact_name: rust-auto-format

  fmt-commit:
    name: Commit Format
    needs: fmt
    # A fork's pull request gets no secrets, and its branch is not in this repository.
    if: >-
      github.event_name == 'pull_request' && needs.fmt.outputs.changes_detected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Where ACTIONS_MAINTENANCE_APP_ID and ACTIONS_MAINTENANCE_PRIVATE_KEY live. Only this job,
    # which runs no repository code, gets it.
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    # Shared with docs.yml, which renders README.md onto the same branch. Both make verified
    # commits through the API, and that call rejects a commit whose parent has moved — so two of
    # them racing would leave one failing for no reason a reader could act on. They queue instead.
    concurrency:
      group: branch-writes-${{ github.event.pull_request.head.repo.full_name || github.repository }}:${{ github.event.pull_request.head.ref || github.ref_name }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read # Required to fetch the commit the patch applies to; the write uses the App token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # An App installation token, so the commit is verified and re-triggers the checks on the
      # branch it lands on. Scoped to the one permission the commit needs.
      - name: Generate Bot Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # Required to commit the formatted files

      # `artifact_name` is spelled out rather than read from the format job's output, which a job
      # running pull request code produced. `allowed_paths` admits only Rust
      # sources, the only files `cargo fmt` rewrites; any other path fails this job and nothing is committed.
      - name: Commit Format
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.token.outputs.token }}
          artifact_name: rust-auto-format
          allowed_paths: '**/*.rs'
          commit_message: 'style: auto-format rust code'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The shared action only annotates findings; `-D warnings` is what fails the job on them.
      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-clippy-v1.1.13
        with:
          clippy_arguments: '--all-features --all-targets -- -D warnings'

  # The rustdoc lints in [workspace.lints.rustdoc] only run under `rustdoc`, never under
  # `cargo check` or `cargo clippy`, so a broken intra-doc link is invisible to every other job
  # here. `RUSTDOCFLAGS` is where the deny lands, because rustdoc reads it and `cargo doc` has no
  # flag for it.
  doc:
    name: Doc
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    env:
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Render the documentation
        run: cargo doc --all-features --no-deps

      # The `test` job is `cargo nextest`, which runs no doctest at all. This step is the only
      # place in CI the example on `DownloadData::get_entry` is compiled and asserted.
      - name: Run the doctests
        run: cargo test --doc --all-features

  docker-build-test:
    name: Docker Build and Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # `doc` as well as `check`: this job publishes the image and its configuration contract, and
    # the contract is generated from the same doc comments the documentation job renders. An
    # image whose contract came out of a crate that will not document is not one to build.
    needs: [check, doc]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Prepare platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Every build reads the layer cache of its platform; only a push to `master` writes it.
      #
      # A pull request's export lands in a cache `master` never reads, but it counts against the
      # repository's 10 GB Actions cache all the same, and each one that rebuilt the cook layer
      # added a compiled dependency tree of about 520 MB per platform. GitHub makes room by evicting
      # the least recently used entries, `master`'s among them: a pull request run found
      # `master`'s arm64 index naming blobs that were gone (`blob … not found`). The cost is that a
      # pull request changing the lockfile or the build stages cooks again on each of its pushes.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: image:test
          build-args: |
            version=test
            release=test
            vendor=Timmi6790
            VERSION=test
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', env.PLATFORM_SLUG) || '' }}

      - name: Verify image architecture
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          expected="${PLATFORM#*/}"
          actual=$(docker image inspect image:test --format='{{.Architecture}}')
          echo "Expected: ${expected}, actual: ${actual}"
          [ "${expected}" = "${actual}" ]

      # The `contract` stage holds the two generated files and nothing else, so this exports a
      # two-file layer rather than the builder's filesystem. It is the same build graph as the
      # image, which is also what makes the exported document *the* document the image carries.
      # The build arguments have to match that build exactly, or the two would legitimately differ.
      #
      # Through the action rather than a `docker buildx build` in a `run` step: `type=gha` needs the
      # runtime token the action hands to BuildKit and a `run` step does not see, so the flag there
      # read nothing. The image build pulls cached layers lazily, so on a run whose image came from
      # the cache the contract stage was not on the runner, and the step rebuilt it from the
      # toolchain up: 115 s on a run whose image build took 3 s. It reads the cache and writes
      # nothing.
      - name: Export the generated configuration contract
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: contract
          outputs: type=local,dest=contract-out
          build-args: |
            version=test
            release=test
            vendor=Timmi6790
            VERSION=test
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}

      - name: Show the exported configuration contract
        run: |
          ls -l contract-out
          cat contract-out/contract.labels

      # The checkpoint the whole scheme rests on, and the reason a hand-written LABEL block is
      # safe. Checking the *image* rather than the Dockerfile is the point: a source diff cannot
      # see a base image that overrode a label, a `LABEL` line deleted on a branch nobody diffed,
      # or a build argument that failed to interpolate. Blocking, on every platform in the
      # matrix — labels live in each manifest's own config blob, so one architecture can carry
      # them while another does not.
      #
      # The toolchain is here rather than at the top of the job because only this step needs it:
      # the action renders the labels from `src/config.rs` itself rather than trusting a file
      # the build wrote, which is what lets it also check the Dockerfile region and the
      # committed document in the same pass.
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # This job publishes an image, and a restored cache is writable by any branch:
          # caching here would let a poisoned entry reach a runtime artefact. The only
          # thing compiled is the contract generator, so there is almost nothing to save.
          cache: false

      - name: Verify the image's configuration contract
        uses: TimSchoenle/actions/actions/rust/config-contract@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-config-contract-v1.4.0
        with:
          image: image:test

      - name: Test Docker image runs
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set +e
          output=$(docker run --rm image:test 2>&1)
          status=$?
          set -e
          echo "${output}"
          echo "Exit status: ${status}"
          # The image has no shell and the binary exits on missing configuration, so a
          # non-zero exit is expected. Exit codes in the 125-127 range mean the runtime
          # could not execute the binary at all, which is what a wrong-architecture or
          # broken (e.g. mis-packed) build looks like.
          if [ "${status}" -ge 125 ] && [ "${status}" -le 127 ]; then
            echo "::error::Container failed to execute the binary (exit ${status})"
            exit 1
          fi
          if echo "${output}" | grep -qi 'exec format error'; then
            echo "::error::Binary is not executable on ${PLATFORM}"
            exit 1
          fi

      # Size check, Trivy scan and SARIF upload in one step. `platform` derives the SARIF category
      # `trivy-linux-amd64` / `trivy-linux-arm64` — the same value `trivy-${PLATFORM_SLUG}` produced
      # before — so the existing code-scanning alerts stay attached to their category. `summary`
      # makes each leg upload a fragment instead of commenting, because two legs cannot share one
      # comment without racing; the `image-size-report` job below turns the fragments into the table.
      - name: Check Docker image
        uses: TimSchoenle/actions/actions/docker/image-check@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-docker-image-check-v1.1.7
        with:
          image: image:test
          platform: ${{ matrix.platform }}
          comment: summary

  # One table of every platform rather than one comment per leg. `always()`, so a leg that failed
  # does not cost the table the rows of the legs that passed. Reporting only: nothing here gates
  # the merge.
  image-size-report:
    name: Image Size Report
    runs-on: ubuntu-latest
    needs: docker-build-test
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read # Required to download this run's image-check fragments
      pull-requests: write # Required to comment on PRs with image size
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # `docker-image-size` is the identifier the hand-written table used, so open pull requests
      # get their existing comment updated rather than a second one beside it.
      - name: Comment image sizes on PR
        uses: TimSchoenle/actions/actions/docker/image-check-summary@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-docker-image-check-summary-v1.1.6
        with:
          identifier: docker-image-size

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0