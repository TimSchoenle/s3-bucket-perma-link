name: Docs

# The generated documents are rendered and committed on a pull request by the `render` job in
# generate.yaml and by generate-commit.yaml. This workflow is the other direction: wherever
# nothing commits (a push to the default branch, a pull request from a fork) it renders in
# `check` mode, writing nothing and failing when a committed file is stale. Without it, editing
# a generated page directly would appear to work right up until the next pull request silently
# reverted it.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:

  check:
    name: README
    # The complement of `render` in generate.yaml: the pushes to `master` that no pull request rendered, and the
    # fork pull requests that could not be committed to. Between the two conditions, every event
    # this workflow sees is handled by exactly one job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      # The same two steps as `render` in generate.yaml, in the same order and with the same inputs. They have to
      # be: this job's whole job is to reproduce that render and compare, so a difference between
      # the two step lists here would be a gate that passes on a stale file.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          json="$(cargo run --quiet --example readme-variables)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-readme-variables-v2.1.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Writes nothing; fails with the first differing line when README.md is stale.
      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-render-template-v3.0.1
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      # The same half for the contract and the Dockerfile's LABEL region: writes nothing, and
      # fails with the diff when either has drifted from the configuration types. A stale LABEL
      # region is fixed by running `just regenerate` locally; no bot writes the Dockerfile.
      #
      # `image` is empty, so the two checks that need one are skipped and this job stays the
      # cheap half: it reports a renamed key in the pull request that renamed it, without
      # waiting for a build.
      - name: Verify the configuration contract is current
        uses: TimSchoenle/actions/actions/rust/config-contract@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-rust-config-contract-v2.0.1
        with:
          image: ''
