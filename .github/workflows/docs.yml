name: Docs

# Three artefacts in this repository are generated from `src/config.rs` and then committed, and
# this workflow is what makes that claim true in both directions:
#
#   README.md                   rendered from `.github/templates/README.md.hbs`
#   docs/config.contract.json   the contract the image publishes and a chart validates against
#   Dockerfile                  the LABEL block that makes that contract discoverable
#
# On a pull request it regenerates all three and commits the result to the branch, so none of
# them is ever edited by hand. The case that matters is a pull request that adds or renames a
# configuration key: it arrives with the documentation and the contract for that key already
# written, because both are read off the type in the same commit that changes it.
#
# That half is two jobs. `render` runs the generators, which means running the pull request's
# code, so it holds no secret and only uploads what they wrote as a patch. `render-commit` holds
# the App token, executes nothing from the branch, and commits that patch only when every path in
# it is one of the three files above.
#
# Everywhere it cannot commit — a push to `master`, a pull request from a fork — it runs the same
# generators in `check` mode instead, writing nothing and failing if what is committed is stale.
# Without that half, editing one of them directly would appear to work right up until the next
# pull request silently reverted it.
#
# The contract has a second, stronger gate that lives elsewhere: `build.yaml` checks the labels
# the *built image* carries, which is the only check that can see a base image overriding a label
# or a build argument that failed to interpolate. This one is cheaper and one step earlier.

on:
  pull_request:
  push:
    branches: [master]

# Not scoped to this workflow: the `fmt-commit` job in build.yaml also commits to the pull request
# branch, and the API call that makes a verified commit rejects one whose parent has moved. Two
# writers racing would leave one of them failing for no reason a reader could act on, so they
# queue instead. `cancel-in-progress: false` for the same reason — a cancelled run here means a
# branch left holding a half-generated file.
concurrency:
  group: branch-writes-${{ github.event.pull_request.head.repo.full_name || github.repository }}:${{ github.event.pull_request.head.ref || github.ref_name }}
  queue: max
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  render:
    name: Render
    # Forks get no secrets, so the commit half below could not mint a token and their branch is not
    # in this repository anyway. `check` below picks those pull requests up instead.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This half runs the pull request's code — `just regenerate` and the payload example — so it
    # holds no secret and no write token. It writes the regenerated files into its own checkout
    # and uploads them as a patch; `render-commit` below commits that patch without running
    # anything from the branch.
    permissions:
      contents: read # Required to checkout the code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The head of the pull request, not the merge commit: the render has to read the `Config`
      # the pull request proposes, and the patch is committed to the branch, so it has to be
      # computed against the commit the branch points at. The SHA rather than the branch name, so
      # the patch's base is the commit `render-commit` checks the branch against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # The other two artefacts generated from `src/config.rs`: the contract the image publishes,
      # and the LABEL block in the Dockerfile that makes it discoverable. Regenerated for the same
      # reason the README is — a pull request that renames a key or changes the loader's prefix
      # arrives with the document for it already written, in the commit that caused it.
      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      - name: Regenerate the configuration contract
        run: just regenerate

      # The half of the payload only this crate can produce: the two configuration tables and the
      # loader's own spellings. It deliberately emits no `repo`, `branch`, `release` or `docs` —
      # `extra` is deep-merged over the derived payload, so a key spelled the same way there
      # would replace what the action worked out.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          json="$(cargo run --quiet --example readme-variables)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # The other half, read off the files in the checkout: the repository coordinates, the
      # release from Cargo.toml, and the table of documents walked out of docs/.
      #
      # `branch` is the repository's default branch and not `github.ref_name`, which on a pull
      # request is `<number>/merge`. Rendering that into the badge and permalink URLs would make
      # this job and the `check` job below disagree by construction, and every merge would then
      # fail the gate for a reason that is not in its diff.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-readme-variables-v1.2.9
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Written, not committed: the commit is `render-commit`'s, over every generated file at once.
      - name: Render the README
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}

      # Named rather than left to default to `.`, so nothing else a step left dirty in the
      # workspace can ride along. `render-commit` holds the same list as its allowlist and refuses
      # a patch touching anything outside it.
      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-create-patch-v1.1.0
        with:
          artifact_name: docs-render
          paths: README.md docs/config.contract.json Dockerfile

  render-commit:
    name: Commit Render
    needs: render
    # A fork's pull request gets no secrets, and its branch is not in this repository.
    if: >-
      github.event_name == 'pull_request' && needs.render.outputs.has_changes == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Where ACTIONS_MAINTENANCE_APP_ID and ACTIONS_MAINTENANCE_PRIVATE_KEY live, as in the
    # `fmt-commit` job of build.yaml. Only this job, which runs no repository code, gets it.
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read # Required to fetch the commit the patch applies to; the write uses the App token
    steps:
      # Nothing from the branch runs here, so the egress this job needs is known in full: GitHub
      # for the checkout, the token and the commit, and the artifact service for the patch.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # A second copy of the patch `commit-patch` downloads below, read only by the check that
      # follows.
      - name: Receive the patch for inspection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-render
          path: ${{ runner.temp }}/docs-render-inspect

      # `allowed_paths` below can admit the Dockerfile only as a whole, and the Dockerfile is the
      # build recipe of the published image: a generator that rewrote a `RUN` line would have it
      # committed by the App, under the App's name. So the patch is applied to a scratch index on
      # top of the head commit - git plumbing only, nothing from the checkout runs - and the
      # result has to equal the head's Dockerfile everywhere outside the `terrace-config:labels`
      # markers, with each marker exactly once and nothing between them but `LABEL key="value"`
      # lines and their continuations, which is all `--format dockerfile` emits. A region in any
      # other shape fails here and is committed by nobody; regenerate it locally with
      # `just regenerate` and push it by hand.
      - name: Refuse Dockerfile changes outside the LABEL region
        env:
          PATCH_FILE: ${{ runner.temp }}/docs-render-inspect/changes.patch
          METADATA_FILE: ${{ runner.temp }}/docs-render-inspect/metadata.json
          BEGIN: '# terrace-config:labels:begin'
          END: '# terrace-config:labels:end'
        run: |
          set -euo pipefail
          # A patch computed against another commit is skipped by `commit-patch`, not committed;
          # the run for the new head checks its own.
          if [ "$(jq -r .base_sha "$METADATA_FILE")" != "$(git rev-parse HEAD)" ]; then
            echo "The patch was computed against another commit; commit-patch will skip it."
            exit 0
          fi
          work="$RUNNER_TEMP/dockerfile-check"
          mkdir -p "$work"
          export GIT_INDEX_FILE="$work/index"
          git read-tree HEAD
          git apply --cached --whitespace=nowarn --include=Dockerfile "$PATCH_FILE"
          git show HEAD:Dockerfile > "$work/before"
          git show :Dockerfile > "$work/after"
          if cmp -s "$work/before" "$work/after"; then
            echo "The patch does not change the Dockerfile."
            exit 0
          fi
          for marker in "$BEGIN" "$END"; do
            if [ "$(grep -cxF -- "$marker" "$work/after")" != 1 ]; then
              echo "::error file=Dockerfile::'${marker}' must appear exactly once."
              exit 1
            fi
          done
          if [ "$(grep -nxF -- "$BEGIN" "$work/after" | cut -d: -f1)" -gt "$(grep -nxF -- "$END" "$work/after" | cut -d: -f1)" ]; then
            echo "::error file=Dockerfile::'${BEGIN}' must come before '${END}'."
            exit 1
          fi
          outside() { awk -v b="$BEGIN" -v e="$END" '$0 == b { skip = 1; print "<region>"; next } $0 == e { skip = 0; next } !skip' "$1"; }
          if ! diff -u <(outside "$work/before") <(outside "$work/after"); then
            echo "::error file=Dockerfile::The patch changes the Dockerfile outside the LABEL region; nothing was committed."
            exit 1
          fi
          if ! awk -v b="$BEGIN" -v e="$END" '
            $0 == e { inside = 0 }
            inside {
              if (cont) { ok = $0 ~ /^[ \t]+[A-Za-z0-9._-]+="[^"\\$]*"( \\)?$/ }
              else { ok = $0 ~ /^LABEL [A-Za-z0-9._-]+="[^"\\$]*"( \\)?$/ }
              if (!ok) { print "unexpected line in the LABEL region: " $0; bad = 1 }
              cont = $0 ~ / \\$/
            }
            $0 == b { inside = 1; cont = 0 }
            END { exit (bad || cont) }
          ' "$work/after"; then
            echo "::error file=Dockerfile::The LABEL region holds something other than LABEL instructions; nothing was committed."
            exit 1
          fi
          echo "The patch changes only the LABEL region of the Dockerfile."

      # An App installation token, so the commit is verified and — unlike one made with
      # `GITHUB_TOKEN` — re-triggers the checks on the branch it lands on.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # Required to commit the patch to the pull request's branch

      # The artifact name is a literal, not the render job's output: that job ran the pull
      # request's code. One commit over all three files, because a second commit would have to
      # name the head the first just moved. If `fmt-commit` committed first, the branch has moved
      # past the commit the patch was made from, and commit-patch skips it with
      # `outcome: branch_moved`; the new head starts a new run, which renders again.
      - name: Commit the generated files
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          artifact_name: docs-render
          # Exactly the files `render` writes. The Dockerfile is here only because `just
          # regenerate` rewrites its `terrace-config:labels` region; any other path fails this job.
          allowed_paths: 'README.md docs/config.contract.json Dockerfile'
          commit_message: 'docs: regenerate the README and the configuration contract'

      - name: Summarise
        env:
          OUTCOME: ${{ steps.commit.outputs.outcome }}
          COMMIT_URL: ${{ steps.commit.outputs.commit_url }}
        run: |
          case "${OUTCOME}" in
            committed) echo "README.md and the configuration contract re-rendered: ${COMMIT_URL}" >> "$GITHUB_STEP_SUMMARY" ;;
            branch_moved) echo "The branch moved while rendering; the run for the new head renders again." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "README.md and the configuration contract already matched their sources." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  check:
    name: README
    # The complement of `render`: the pushes to `master` that no pull request rendered, and the
    # fork pull requests that could not be committed to. Between the two conditions, every event
    # this workflow sees is handled by exactly one job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # The same two steps as `render`, in the same order and with the same inputs. They have to
      # be: this job's whole job is to reproduce that render and compare, so a difference between
      # the two step lists here would be a gate that passes on a stale file.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          json="$(cargo run --quiet --example readme-variables)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-readme-variables-v1.2.9
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Writes nothing; fails with the first differing line when README.md is stale.
      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      # The same half for the contract and the Dockerfile's LABEL region: writes nothing, and
      # fails with the diff when either has drifted from the configuration types. Without it,
      # editing the committed contract by hand would appear to work right up until the next pull
      # request silently reverted it — and a stale LABEL region is a contract nothing can find.
      #
      # `image` is empty, so the two checks that need one are skipped and this job stays the
      # cheap half: it reports a renamed key in the pull request that renamed it, without
      # waiting for a build.
      - name: Verify the configuration contract is current
        uses: TimSchoenle/actions/actions/rust/config-contract@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-config-contract-v1.4.0
        with:
          image: ''
