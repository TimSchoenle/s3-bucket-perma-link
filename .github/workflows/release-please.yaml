name: release-please
on:
  push:
    branches:
      - master

# Queued, never cancelled. A run that has reached the publish jobs can be part-way through pushing
# and signing an image when the next push to the branch arrives; cancelling it there leaves a
# published tag with no signature or attestation, and the tag is not created again by a later run.
# Only a run still waiting can be replaced by a newer one, which is harmless: release-please reads
# the whole branch, so the newer run sees every commit the replaced one would have.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: { }

env:
  DOCKER_REPO: timschoenle/s3-bucket-perma-link
  HELM_REPO: TimSchoenle/helm-charts
  CHART_PATH: charts/s3-bucket-perma-link
  # Pinned to what TimSchoenle/helm-charts pins in its `justfile`, because these are the two
  # tools whose output that repository reads back. Bump them together with it.
  ORAS_VERSION: 1.3.3
  COSIGN_VERSION: v3.1.3

jobs:
  release-please:
    environment:
      name: release
      deployment: false
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required to create release commits and tags
      issues: write # Required to create release issues
      pull-requests: write # Required to create release PRs
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # `tag_name` carries the `v` and `version` does not: image tags are `vX.Y.Z`, appVersion is `X.Y.Z`.
      version: ${{ steps.release.outputs.version }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Narrowed to what release-please does with it: push the release branch and tag,
          # open and update the release pull request, and label it. An unscoped token inherits
          # every permission the installation holds, which zizmor's `github-app` rule reports.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.generate_token.outputs.token }}

  docker-build:
    environment:
      name: release
      deployment: false
    name: Docker Build (${{ matrix.platform }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Prepare platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag release-please just cut, not the event commit: a queued run can release a
          # newer merge than the one that triggered it.
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # This job pushes the release image, so buildx is downloaded fresh rather than restored
          # from the Actions cache, where a poisoned entry would end up in the published image.
          cache-binary: false

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels, annotations) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Read the revision and ref from the checked-out tag. The default `workflow` context takes
          # them from the event, which on a queued run is a later commit than the one released.
          context: git
          images: ${{ env.DOCKER_REPO }}

      # Pushed by digest only; the tags are attached to the manifest list in docker-release.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            version=${{ needs.release-please.outputs.tag_name }}
            release=${{ needs.release-please.outputs.tag_name }}
            vendor=TimSchoenle
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            VERSION=${{ needs.release-please.outputs.tag_name }}
          secrets: |
            sentry_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      # Runs on the builder the push above already populated, so every layer is a cache hit and
      # the exported document is the one that went into the image. The build arguments have to
      # match that build exactly — `version` reaches the contract's `app` block, so a different
      # value here would produce a different document and the comparison below would fail for a
      # reason that is not a defect.
      - name: Export the generated configuration contract
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          docker buildx build \
            --target contract \
            --platform "${PLATFORM}" \
            --build-arg "version=${TAG_NAME}" \
            --build-arg "release=${TAG_NAME}" \
            --build-arg vendor=TimSchoenle \
            --build-arg "VERSION=${TAG_NAME}" \
            --output "type=local,dest=contract-out" \
            .
          cat contract-out/contract.labels

      # The gate everything downstream is allowed to trust. It runs against the image that was
      # actually pushed, per platform: labels live in each manifest's own config blob, so one
      # architecture can carry them while another does not, and each matrix leg is the only run
      # that sees its own. `docker-release` needs this job, so nothing is tagged, attached or
      # signed until every platform has passed.
      #
      # The floating tags do not exist yet — they are created from these digests in
      # `docker-release` — so a failure here costs a retry rather than a release.
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # This job publishes an image, and a restored cache is writable by any branch:
          # caching here would let a poisoned entry reach a runtime artefact. The only
          # thing compiled is the contract generator, so there is almost nothing to save.
          cache: false

      - name: Pull the pushed image
        env:
          IMAGE: ${{ env.DOCKER_REPO }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull --quiet "${IMAGE}@${DIGEST}"

      # The labels are constants for this service, so they do not depend on the `version` this
      # build was given: the action renders them from the types and compares them with what the
      # pushed manifest's config blob carries. The document inside the image does name this
      # build, which is why the action checks that it is there and a contract rather than
      # diffing it against a fresh, versionless render.
      - name: Verify the pushed image's configuration contract
        uses: TimSchoenle/actions/actions/rust/config-contract@54a4dc05fd351a9bf9e9638fa3ebbc572b5f2d7f # tag=actions-rust-config-contract-v2.0.7
        with:
          image: ${{ env.DOCKER_REPO }}@${{ steps.build.outputs.digest }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # The bytes `docker-release` attaches to the manifest list's digest. Uploaded from every
      # platform rather than one, so that job can prove the two builds produced the same document
      # before publishing either — the generator reads nothing architecture-dependent, and a
      # difference would mean one of the two images describes a configuration the other does not.
      - name: Upload the generated configuration contract
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-${{ env.PLATFORM_SLUG }}
          path: contract-out/contract.json
          if-no-files-found: error
          retention-days: 1

  docker-release:
    environment:
      name: release
      deployment: false
    name: Docker Release
    needs: [ release-please, docker-build ]
    if: ${{ needs.release-please.outputs.release_created }}
    outputs:
      image_digest: ${{ steps.manifest.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required for OIDC authentication with Cosign
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # For `terrace-contract image attach` below. It shells out to the `oras` this job installs, so the
      # action installs none of its own. It does put its own cosign on PATH, which is why it runs before
      # the job's cosign install: that one is added to PATH last and stays the cosign every signature uses.
      - name: Install terrace-contract
        uses: TimSchoenle/actions/actions/terrace/setup@54a4dc05fd351a9bf9e9638fa3ebbc572b5f2d7f # tag=actions-terrace-setup-v4.0.3
        with:
          # renovate: datasource=github-releases depName=TimSchoenle/terrace-config extractVersion=^terrace-contract-v(?<version>.+)$
          version: '0.14.2'
          oras: 'false'

      # Pinned to the release the chart repository verifies with, so a signature this job writes
      # and a signature that job reads are never produced by two versions that disagree about the
      # bundle format.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKER_REPO }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - name: Create and push manifest list
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.DOCKER_REPO }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -o pipefail
          # Word splitting is wanted: each substitution yields several arguments (`-t <tag>` pairs,
          # one source per digest file), and none of the values contain whitespace.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Inspect manifest list
        env:
          IMAGE: ${{ env.DOCKER_REPO }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

      - name: Sign the images with GitHub OIDC Token
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          images=()
          for tag in ${TAGS}; do
            images+=("${tag}@${DIGEST}")
          done
          cosign sign --yes "${images[@]}"

      # --------------------------------------------------------------------------------------
      # The configuration contract
      # --------------------------------------------------------------------------------------
      #
      # Published only now, because `docker-build` is a dependency of this job and every platform
      # in it checked the labels on the image it had just pushed. Nothing is attached or signed
      # until that has passed.
      #
      # The document is attached to the *digest*, not to a tag: a tag can be moved, and the
      # attachment is the only tie between an image and its contract. There is no digest field
      # inside the document to fill in — a digest is what building an image produces, so writing
      # one would change bytes that were already generated and already checked.

      - name: Download the generated configuration contracts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/contracts
          pattern: contract-*

      # One document for the whole manifest list, so the platforms have to agree on it. The
      # generator reads nothing architecture-dependent, so a difference here is not a platform
      # quirk — it means one of the two images describes a configuration the other does not, and
      # publishing either as "the" contract for the index would be a guess.
      - name: Verify every platform generated the same contract
        id: contract
        working-directory: ${{ runner.temp }}/contracts
        run: |
          set -euo pipefail
          reference=""
          for candidate in */contract.json; do
            if [ -z "${reference}" ]; then
              reference="${candidate}"
              continue
            fi
            if ! cmp --silent "${reference}" "${candidate}"; then
              echo "::error::${reference} and ${candidate} are different documents; the" \
                   "platforms of one manifest list do not agree on what this image reads"
              cmp "${reference}" "${candidate}" || true
              exit 1
            fi
          done
          if [ -z "${reference}" ]; then
            echo "::error::no contract was uploaded by any platform"
            exit 1
          fi
          echo "path=${RUNNER_TEMP}/contracts/${reference}" >> "$GITHUB_OUTPUT"
          echo "every platform published the same contract ($(wc -c < "${reference}") bytes)"

      # Pinned to the release the chart repository pins, as Cosign is above. Installed by the
      # action, pinned by commit, as the other services of this estate do: it checks the archive
      # against the SHA-256 it ships for each release, where a bare download in this job, which
      # holds the registry credentials and the signing identity, checked nothing.
      - name: Install ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ env.ORAS_VERSION }}

      # Attached verbatim: the bytes the generator wrote inside the build, checked against the
      # copy inside the image, with nothing added afterwards. The chart repository reads both
      # carriers and refuses the image if they differ.
      #
      # Idempotent, so re-running this job is safe. A rerun builds the same digest, and a bare
      # `oras attach` would hang a second, identical referrer on it, which the chart repository
      # then refuses as a digest with two contracts. `terrace-contract image attach` asks first:
      # a referrer holding these exact bytes is reported and nothing is attached, a referrer
      # holding anything else fails the step, and only a digest with no contract gets one. Either
      # way it prints the referrer's digest on stdout, which the next step signs.
      #
      # The reference is spelled out with its registry. `terrace-contract` does not apply Docker's
      # implicit `docker.io` default and refuses a bare `user/repo`. Everything else in this job —
      # buildx, cosign — defaults the registry itself, which is why these two steps are the only
      # place it is written.
      - name: Attach the configuration contract to the image digest
        id: attach
        env:
          IMAGE: docker.io/${{ env.DOCKER_REPO }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          CONTRACT: ${{ steps.contract.outputs.path }}
        run: |
          set -euo pipefail
          referrer="$(terrace-contract image attach "${CONTRACT}" --image "${IMAGE}@${DIGEST}")"
          if ! [[ "${referrer}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::terrace-contract image attach printed '${referrer}', not a referrer digest"
            exit 1
          fi
          echo "referrer=${referrer}" >> "$GITHUB_OUTPUT"

      # The referrer is a manifest of its own, and signing it is what lets a consumer trust the
      # document without trusting whoever could push to this repository. The subject digest is
      # already signed by the step above; this signs the attachment.
      #
      # Signs exactly the digest the attach step printed, rather than whatever `oras discover`
      # lists. Docker Hub's referrers index is eventually consistent: right after an attach it can
      # still answer with no referrer, or with only an older one, so reading it back here could
      # sign the wrong manifest. The printed digest needs no lookup, so there is nothing to poll.
      - name: Sign the attached contract with GitHub OIDC Token
        env:
          IMAGE: docker.io/${{ env.DOCKER_REPO }}
          REFERRER: ${{ steps.attach.outputs.referrer }}
        run: |
          set -euo pipefail
          echo "signing ${IMAGE}@${REFERRER}"
          cosign sign --yes "${IMAGE}@${REFERRER}"

  sentry-release:
    environment:
      name: release
      deployment: false
    name: Sentry Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag release-please just cut, not the event commit: a queued run can release a
          # newer merge than the one that triggered it.
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Sentry Release
        uses: getsentry/action-release@d55c8c3b7375607e972b710f12926b676d89d7d2 # v3.8.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          version: ${{ needs.release-please.outputs.tag_name }}
          environment: production

  helm-release:
    environment:
      name: release
      deployment: false
    name: Helm Release
    needs: [ release-please, docker-release ]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: TimSchoenle/actions/actions/helm/update-chart-version@54a4dc05fd351a9bf9e9638fa3ebbc572b5f2d7f # tag=actions-helm-update-chart-version-v1.8.2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          helm-repo: ${{ env.HELM_REPO }}
          chart-path: ${{ env.CHART_PATH }}
          # `Chart.yaml` records `appVersion` without the `v` its image tag carries.
          app-version: ${{ needs.release-please.outputs.version }}
          images: |
            {
              "image.tag": {
                "tag": "${{ needs.release-please.outputs.tag_name }}",
                "digest": "${{ needs.docker-release.outputs.image_digest }}"
              }
            }
          # Carried into the chart pull request as its release notes. The action neutralizes
          # mentions and issue-closing keywords, so the chart pull request notifies nobody and
          # closes nothing here; issue links in the notes still show up as references on them.
          changelog: ${{ needs.release-please.outputs.body }}